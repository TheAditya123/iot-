name: Python tests

on:
  push:
    branches: ["main", "smart-room-operations-agent"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements-pi.txt
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
